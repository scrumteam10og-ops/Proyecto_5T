# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/stardinasty?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Driver de MySQL (Spring Boot 3+ lo detecta automáticamente, pero es bueno dejarlo explícito)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.org.springframework.security=DEBUG 
#temporal
# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# update: Actualiza las tablas en la BD si agregas nuevos campos sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las consultas SQL que Spring ejecuta por detrás
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# CONFIGURACIÓN DE VISTAS (Thymeleaf)
# ===================================================================
# Desactiva la caché en desarrollo para ver los cambios en los HTML al recargar la página
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging.level.org.thymeleaf=DEBUG
logging.level.org.springframework.web=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always
# ===================================================================
# PUERTO DEL SERVIDOR
# ===================================================================
server.port=8081