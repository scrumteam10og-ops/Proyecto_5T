<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - STARDINASTY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Gestión de Usuarios</h2>
            <p class="text-muted mb-0">Listado de usuarios registrados en la base de datos.</p>
        </div>
        <div>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary me-2">
                <i class="bi bi-arrow-left"></i> Volver al Dashboard
            </a>
            <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-info text-white">
                <i class="bi bi-person-plus-fill"></i> Nuevo Usuario
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${listaUsuarios}">
                        <td th:text="${u.idUsuario}">1</td>
                        <td th:text="${u.nombre}">Nombre</td>
                        <td th:text="${u.correo}">correo@ejemplo.com</td>
                        <td>
                            <span class="badge bg-secondary" th:text="${u.rol}">ROL</span>
                        </td>
                        <td>
                            <span th:if="${u.estado == 'A'}" class="badge bg-success">Activo</span>
                            <span th:if="${u.estado != 'A'}" class="badge bg-danger">Inactivo</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/usuarios/editar/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil-square"></i> Editar
                            </a>
                            <a th:href="@{/admin/usuarios/cambiar-estado/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-secondary ms-1">
                                <i class="bi bi-arrow-repeat"></i> Cambiar Estado
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaUsuarios)}">
                        <td colspan="6" class="text-center py-4 text-muted">No hay usuarios registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
