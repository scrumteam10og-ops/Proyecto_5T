<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>STARDINASTY - Formulario de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">STARDINASTY Admin</a>
    </div>
</nav>

<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white fw-bold">
                    <span th:text="${producto.idProducto != null ? 'Editar Producto' : 'Crear Nuevo Producto'}">Formulario</span>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/inventario/guardar}" th:object="${producto}" method="post">
                        <!-- Campo oculto para guardar el ID si es edición -->
                        <input type="hidden" th:field="*{idProducto}" />

                        <!-- Selección de Categoría Obligatoria -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Categoría *</label>
                            <select th:field="*{categoria.idCategoria}" class="form-select" required>
                                <option value="" disabled th:selected="${producto.categoria == null}">Selecciona una categoría</option>
                                <option th:each="cat : ${categorias}" 
                                        th:value="${cat.idCategoria}" 
                                        th:text="${cat.nombre}">
                                </option>
                            </select>
                        </div>

                        <!-- Referencia del Producto -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Referencia *</label>
                            <input type="text" th:field="*{referenciaProducto}" class="form-control" required placeholder="Ej: 5SN0" />
                        </div>

                        <!-- Nombre del Producto -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre del Producto *</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Chaqueta Vintage" />
                        </div>

                        <!-- Descripción -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Descripción</label>
                            <textarea th:field="*{descripcion}" class="form-control" rows="3" placeholder="Detalles o especificaciones del producto"></textarea>
                        </div>

                        <!-- Cantidad y Valor Venta -->
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold">Cantidad (Stock) *</label>
                                <input type="number" th:field="*{cantidad}" class="form-control" min="0" required />
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label small fw-bold">Precio de Venta ($) *</label>
                                <input type="number" th:field="*{valorVenta}" class="form-control" min="0" required />
                            </div>
                        </div>

                        <!-- Estado -->
                        <div class="mb-4" th:if="${producto.idProducto != null}">
                            <label class="form-label small fw-bold">Estado</label>
                            <select th:field="*{estado}" class="form-select">
                                <option value="A">Activo</option>
                                <option value="I">Inactivo</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/admin/inventario" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-success fw-bold">
                                <i class="bi bi-check-circle"></i> Guardar Producto
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
