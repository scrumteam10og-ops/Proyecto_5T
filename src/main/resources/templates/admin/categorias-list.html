<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías - STARDINASTY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Gestión de Categorías</h2>
            <p class="text-muted mb-0">Catálogo de categorías registradas.</p>
        </div>
        <div>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary me-2">
                <i class="bi bi-arrow-left"></i> Volver al Dashboard
            </a>
            <a th:href="@{/admin/categorias/nuevo}" class="btn btn-warning text-white">
                <i class="bi bi-plus-lg"></i> Nueva Categoría
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${listaCategorias}">
                        <td th:text="${c.idCategoria}">1</td>
                        <td th:text="${c.nombre}">Categoría</td>
                        <td class="text-center">
                            <a th:href="@{/admin/categorias/editar/{id}(id=${c.idCategoria})}" class="btn btn-sm btn-warning">Editar</a>
                            <a th:href="@{/admin/categorias/eliminar/{id}(id=${c.idCategoria})}" class="btn btn-sm btn-danger ms-1" onclick="return confirm('¿Eliminar categoría?')">Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaCategorias)}">
                        <td colspan="3" class="text-center py-4 text-muted">No hay categorías registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
