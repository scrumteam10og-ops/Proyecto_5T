<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>STARDINASTY - Registro de Stock Inicial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">STARDINASTY Admin</a>
        <div>
            <a href="/admin/dashboard" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="/admin/inventario" class="btn btn-outline-info btn-sm"><i class="bi bi-boxes"></i> Ver Inventario</a>
        </div>
    </div>
</nav>

<div class="container py-3">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold"><i class="bi bi-cart-check"></i> Compras e Ingresos de Stock</h3>
        <a th:href="@{/admin/stock/nuevo}" class="btn btn-primary fw-bold">
            <i class="bi bi-plus-circle"></i> Registrar Nuevo Stock
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID Stock</th>
                            <th>Ref. Producto</th>
                            <th>Nombre</th>
                            <th>Cantidad</th>
                            <th>Valor Unitario (Costo)</th>
                            <th>Valor Total (Costo)</th>
                            <th>Fecha Compra</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${listaCompras}">
                            <td class="fw-bold text-secondary" th:text="${'STK_' + #numbers.formatInteger(c.idStock, 3)}">STK_001</td>
                            <td th:text="${c.referenciaProducto}">Ref</td>
                            <td th:text="${c.nombre}">Nombre</td>
                            <td th:text="${c.cantidad}">0</td>
                            <td th:text="${'$' + #numbers.formatInteger(c.valorUnitario, 0, 'POINT')}">$0</td>
                            <td th:text="${'$' + #numbers.formatInteger(c.valorTotal, 0, 'POINT')}">$0</td>
                            <td th:text="${c.fechaCompra != null ? #temporals.format(c.fechaCompra, 'dd/MM/yyyy HH:mm') : 'N/A'}">01/01/2026</td>
                            <td class="text-center">
                                <a th:href="@{/admin/stock/editar/{id}(id=${c.idStock})}" class="btn btn-warning btn-sm me-1">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>
                                <a th:href="@{/admin/stock/eliminar/{id}(id=${c.idStock})}" 
                                   class="btn btn-danger btn-sm" 
                                   onclick="return confirm('¿Seguro que deseas eliminar este registro de stock?');">
                                    <i class="bi bi-trash"></i> Eliminar
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listaCompras)}">
                            <td colspan="8" class="text-center py-4 text-muted">No se han registrado compras o stock inicial.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
