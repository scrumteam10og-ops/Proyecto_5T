<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Categoría - STARDINASTY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-warning text-white">
                    <h4 class="mb-0" th:text="${categoria.idCategoria == null ? 'Nueva Categoría' : 'Editar Categoría'}">Categoría</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/categorias/guardar}" th:object="${categoria}" method="post">
                        <input type="hidden" th:field="*{idCategoria}">

                        <div class="mb-3">
                            <label class="form-label">Nombre de Categoría</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/categorias}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-warning text-white">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
