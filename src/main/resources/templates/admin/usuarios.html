<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARDINASTY - Panel de Usuarios</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div class="min-h-screen flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between p-4">
            <div>
                <h1 class="text-2xl font-bold tracking-wider mb-8 text-center border-b border-slate-700 pb-4">STARDINASTY</h1>
                <nav class="space-y-2">
                    <a href="#" class="block px-4 py-2.5 rounded bg-slate-800 text-white font-medium">Usuarios</a>
                    <a href="#" class="block px-4 py-2.5 rounded text-slate-400 hover:bg-slate-800 hover:text-white transition">Productos</a>
                    <a href="#" class="block px-4 py-2.5 rounded text-slate-400 hover:bg-slate-800 hover:text-white transition">Pedidos</a>
                </nav>
            </div>
            <button class="w-full py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded text-sm transition">
                Cerrar Sesión
            </button>
        </aside>

        <!-- Contenido Principal -->
        <main class="flex-1 p-8">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Administración de Usuarios</h2>
                    <p class="text-sm text-gray-500">Gestión de accesos, roles y estado del personal.</p>
                </div>
                <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow">
                    + Nuevo Usuario
                </button>
            </header>

            <!-- Tabla de Usuarios -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            <th class="px-6 py-4">Usuario</th>
                            <th class="px-6 py-4">Correo</th>
                            <th class="px-6 py-4">Rol</th>
                            <th class="px-6 py-4">Estado</th>
                            <th class="px-6 py-4 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200 text-sm">
                        <tr>
                            <td class="px-6 py-4 font-medium text-gray-900">Carlos Mendoza</td>
                            <td class="px-6 py-4 text-gray-500">carlos@stardinasty.com</td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-1 text-xs font-semibold text-indigo-700 bg-indigo-100 rounded-full">ADMIN</span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-1 text-xs font-semibold text-green-700 bg-green-100 rounded-full">Activo</span>
                            </td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <button class="text-indigo-600 hover:text-indigo-900 font-medium text-xs">Editar</button>
                                <button class="text-red-600 hover:text-red-900 font-medium text-xs">Inactivar</button>
                            </td>
                        </tr>
                        <tr>
                            <td class="px-6 py-4 font-medium text-gray-900">Mariana Gómez</td>
                            <td class="px-6 py-4 text-gray-500">mariana@gmail.com</td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-1 text-xs font-semibold text-gray-700 bg-gray-100 rounded-full">CLIENTE</span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-1 text-xs font-semibold text-green-700 bg-green-100 rounded-full">Activo</span>
                            </td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <button class="text-indigo-600 hover:text-indigo-900 font-medium text-xs">Editar</button>
                                <button class="text-red-600 hover:text-red-900 font-medium text-xs">Inactivar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

</body>
</html>
