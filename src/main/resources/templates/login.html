<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARDINASTY - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-wider">STARDINASTY</h1>
            <p class="text-sm text-gray-500 mt-1">Ingresa a tu cuenta para continuar</p>
        </div>

        <!-- Alerta opcional de error -->
        <div class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-xs mb-4 border border-red-200">
            Usuario o contraseña incorrectos.
        </div>

        <form class="space-y-4" action="/login" method="POST">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Correo Electrónico</label>
                <input type="email" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Contraseña</label>
                <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-lg font-semibold transition">
                Ingresar
            </button>
        </form>

        <div class="text-center mt-6 text-xs text-gray-500">
            ¿No tienes cuenta? <a href="/registro" class="text-indigo-600 font-semibold hover:underline">Regístrate aquí</a>
        </div>
    </div>

</body>
</html>
