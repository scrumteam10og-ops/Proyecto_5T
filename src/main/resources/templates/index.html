<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARDINASTY - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">STARDINASTY</a>
            <div>
                <a href="/login" class="btn btn-outline-light me-2">Iniciar Sesión</a>
                <a href="/registro" class="btn btn-light">Registrarse</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-dark text-white text-center py-5 border-top border-secondary">
        <div class="container py-4">
            <h1 class="display-4 fw-bold">ESTILO Y EXCLUSIVIDAD</h1>
            <p class="lead text-muted">Explora nuestras colecciones exclusivas de moda urbana.</p>
            <a href="/login" class="btn btn-primary btn-lg mt-3">Ver Catálogo Completo</a>
        </div>
    </header>

    <main class="container my-5">
        <h3 class="text-center mb-4">Destacados de la Temporada</h3>
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col">
                <div class="card h-100 shadow-sm border-0">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Producto">
                    <div class="card-body">
                        <h5 class="card-title">Colección Oversize</h5>
                        <p class="card-text text-muted">Prendas con corte urbano y acabados de alta calidad.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
